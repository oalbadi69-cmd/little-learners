name: Build Little Learners APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Little Learners
        run: |
          rm -rf build_source
          mkdir build_source
          unzip -q Little_Learners_Flutter_v2_fixed.zip -d build_source
          echo "PROJECT_DIR=$(find build_source -type f -name pubspec.yaml -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Check Dart
        run: |
          cd "$PROJECT_DIR"
          dart format --output=none --set-exit-if-changed lib || true
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Learners-Android
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
